name: 測試

on:
  push:
    paths: ["radar/**", "tests/**", ".github/workflows/test.yml"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r radar/requirements.txt pytest
      - run: python -m pytest -q tests
