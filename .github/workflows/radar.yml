name: 產業雷達

on:
  schedule:
    # GitHub 排程最短 5 分鐘，尖峰時段可能延遲幾分鐘
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "第一次使用：把現有新聞標為已讀，不推播"
        type: boolean
        default: false

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: radar/requirements.txt
      - run: pip install -r radar/requirements.txt
      - name: 掃描並推播
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: python -m radar ${{ inputs.bootstrap && '--bootstrap' || '' }}
      - name: 儲存已讀紀錄與日報
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar/state radar/digest 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "radar: update state $(date -u +%FT%TZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
